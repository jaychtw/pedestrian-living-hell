name: Release v1.0 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Install release test browsers
        run: npx playwright-core install --with-deps chromium firefox
      - name: Verify game logic
        run: npm test
      - name: Start the static development server
        run: |
          npm run dev > /tmp/plh-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/plh-server.log
          exit 1
      - name: Verify Chromium gameplay
        run: |
          CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from 'playwright-core';process.stdout.write(chromium.executablePath())")" npm run test:browser
      - name: Verify Firefox gameplay
        run: |
          FIREFOX_PATH="$(node --input-type=module -e "import {firefox} from 'playwright-core';process.stdout.write(firefox.executablePath())")" npm run test:firefox
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R src _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static game
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
