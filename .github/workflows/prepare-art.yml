name: Prepare generated crossing artwork
on:
  push:
    branches: [art/zhongxiao-higgsfield]
    paths: [.github/workflows/prepare-art.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor generated artwork
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          mkdir -p generated
          curl -fsSL --retry 2 'https://d8j0ntlcm91z4.cloudfront.net/user_3J7S1gNlnMpXN9yy2mYkvTWAnbo/hf_20261121_102739_ebab63ce-c011-4bcd-add8-4abff0101cb2.png' -o /tmp/environment.png
          convert /tmp/environment.png -resize '1920x1280>' -quality 95 generated/environment.webp
          curl -fsSL --retry 2 'https://d8j0ntlcm91z4.cloudfront.net/user_3J7S1gNlnMpXN9yy2mYkvTWAnbo/hf_20261121_102900_b294523f-d37d-4fe0-944e-ac01d84be308.png' -o /tmp/vehicles.png
          convert /tmp/vehicles.png -resize '1920x1280>' -quality 95 generated/vehicles.webp
          curl -fsSL --retry 2 'https://d8j0ntlcm91z4.cloudfront.net/user_3J7S1gNlnMpXN9yy2mYkvTWAnbo/hf_20261121_103015_9eb3a700-8102-464b-ae31-efc6f2da2c62.png' -o /tmp/pedestrian.png
          convert /tmp/pedestrian.png -resize '1920x1280>' -quality 95 generated/pedestrian.webp
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add generated
          git commit -m "Vendor the generated photographic plates for visual review"
          git push
