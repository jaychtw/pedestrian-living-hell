name: Prepare generated crossing artwork
on:
  push:
    branches: [art/zhongxiao-higgsfield]
    paths: [.github/workflows/prepare-art.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor generated artwork
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          mkdir -p generated
          curl -fsSL --retry 2 'https://d8j0ntlcm91z4.cloudfront.net/user_3J7S1gNlnMpXN9yy2mYkvTWAnbo/hf_20261121_103302_74a4b690-0f83-4406-bda3-dd006e0c9870.png' -o /tmp/input.png
          convert /tmp/input.png -resize '1920x1280>' -quality 95 generated/crosswalk.webp
          curl -fsSL --retry 2 'https://d8j0ntlcm91z4.cloudfront.net/user_3J7S1gNlnMpXN9yy2mYkvTWAnbo/hf_20261121_103358_53e496b9-716c-4244-af9b-39fa9f584394.png' -o /tmp/input.png
          convert /tmp/input.png -resize '1920x1280>' -quality 95 generated/steps.webp
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add generated
          git commit -m "Vendor the generated photographic plates for visual review"
          git push
