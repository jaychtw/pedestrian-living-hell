<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172c46" />
    <title>Pedestrian's Living Hell · 行人地獄</title>
    <link rel="stylesheet" href="./src/style.css?v=1.0.0" />
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="./" aria-label="Pedestrian's Living Hell"
          ><span class="brand-icon">行</span><span data-i18n="brand"></span
        ></a>
        <div class="header-end">
          <span class="edition">v1.0</span
          ><button id="language" type="button">繁體中文</button>
        </div>
      </header>
      <section class="scene-shell" data-i18n-aria="sceneLabel">
        <div class="canvas-wrap">
          <canvas
            id="game"
            width="1920"
            height="1432"
            tabindex="0"
            aria-describedby="controls-hint"
          ></canvas>
          <div class="hud" id="hud">
            <div class="signal-state" role="status" aria-live="polite">
              <span id="signal-icon" aria-hidden="true"
                ><svg
                  width="21"
                  height="27"
                  viewBox="0 0 21 27"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                >
                  <circle
                    cx="12"
                    cy="4"
                    r="2"
                    fill="currentColor"
                    stroke="none"
                  />
                  <path
                    d="M11 9 L8 16 L5 24 M8 16 L13 19 L14 24 M10 10 L15 14 L18 14 M10 10 L6 10 L3 15"
                  /></svg></span
              ><strong id="signal-label"></strong
              ><span id="countdown" aria-hidden="true"></span>
            </div>
            <span class="hud-goal" data-i18n="objective"></span>
          </div>
          <div
            id="overlay"
            role="dialog"
            aria-labelledby="overlay-title"
            aria-describedby="overlay-copy"
          >
            <div class="overlay-card">
              <div class="eyebrow" id="overlay-kicker"></div>
              <h1 id="overlay-title"></h1>
              <p id="overlay-copy"></p>
              <p id="opening-controls" data-i18n="controlsCopy"></p>
              <button id="action" type="button"></button
              ><small data-i18n="keyboardStart"></small>
            </div>
          </div>
        </div>
      </section>
      <footer>
        <span id="controls-hint" data-i18n="controlsHint"></span
        ><button id="restart" data-i18n="restart" type="button"></button>
      </footer>
    </main>
    <script type="module" src="./src/main.js?v=1.0.0"></script>
  </body>
</html>
